<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR Studio — DoKitly</title><meta name="description" content="Extract editable English and Hindi text from images in your browser."><link rel="canonical" href="https://dokitly.in/image-tools/ocr-studio.html"><link rel="stylesheet" href="../assets/site-shell.css?v=24"><link rel="stylesheet" href="../assets/build30.css?v=30"><link rel="stylesheet" href="../assets/build31.css?v=31"></head><body><header class="it-header"><div class="it-head-inner"><a class="it-brand" href="/"><img src="../assets/logo.png" alt="DoKitly"></a><nav class="it-nav"><a href="/">Home</a><a href="../all-tools.html">All Tools</a></nav></div></header><main class="it-shell b30"><div class="it-breadcrumb"><a href="/">Home</a> / <a href="index.html">Image Tools</a> / OCR Studio</div><div class="dk-balanced-hero" style="--dk-hero:url('../assets/tool-visuals/build30-ocr-studio.webp?v=30')"><div class="dk-hero-copy"><span class="dk-tool-badge"><img src="../assets/tool-icons/build30-ocr-studio.webp?v=30" alt="" aria-hidden="true"></span><div class="dk-hero-text"><h1>OCR Studio</h1><p>Extract editable text from JPG, PNG and WebP images. English and Hindi are supported.</p><p class="b30-private">Processed privately in your browser. OCR language data is downloaded only when needed.</p></div></div><div class="dk-hero-visual" aria-hidden="true"><img class="dk-tool-visual-img" src="../assets/tool-visuals/build30-ocr-studio.webp?v=30" alt=""></div></div><section class="b30-work"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><select id="lang"><option value="eng">English</option><option value="hin">Hindi</option><option value="eng+hin">English + Hindi</option></select><label>Rotate <select id="rotate"><option>0</option><option>90</option><option>180</option><option>270</option></select></label><label><input id="gray" type="checkbox"> Grayscale preprocessing</label><label>Contrast <input id="contrast" type="range" min="50" max="200" value="100"></label><label>Threshold <input id="threshold" type="range" min="0" max="255" value="0"> <small>0 = off</small></label><div class="b30-actions"><button id="run">Extract text</button><button id="copy">Copy</button><button id="download">Download TXT</button></div><p id="status">Choose an image.</p><textarea id="out" placeholder="OCR result"></textarea></section></main><script src="../assets/ocr-studio.js?v=30"></script><script src="../assets/build30.js?v=30"></script></body></html>
