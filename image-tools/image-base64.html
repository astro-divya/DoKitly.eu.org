ps://dokitly.in/image-tools/image-base64.html" property="og:url"/><meta content="https://dokitly.in/assets/logo.png" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Image ⇄ Base64 — DoKitly" name="twitter:title"/><meta content="Convert an image to a Base64 data URL or decode Base64 back into an image in one browser tool." name="twitter:description"/><meta content="https://dokitly.in/assets/logo.png" name="twitter:image"/></head><body class="standalone-tool-page"><header class="it-header"><div class="it-head-inner"><a class="it-brand" href="../index.html"><img alt="DoKitly" src="../assets/logo.png?v=2"/></a><nav class="it-nav"><a href="../index.html">Home</a><a href="../all-tools.html">Categories</a><a href="../whats-new.html">What’s New</a></nav></div></header><main class="tool-page-shell"><div class="tool-breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Image Tools</a> / Image ⇄ Base64</div><div class="tool-page-head"><span class="tool-page-icon">⇄</span><div><h1>Image ⇄ Base64</h1><p>Encode an image to Base64 or decode a Base64 image without switching tools.</p></div></div><section class="b64-card"><div class="tabs"><button class="active" data-mode="encode">Image → Base64</button><button data-mode="decode">Base64 → Image</button></div><div id="encodePanel"><div class="field"><label>Select image</label><input accept="image/*" id="imgFile" type="file"/></div><div class="field"><label>Base64 data URL</label><textarea id="encoded" placeholder="Select an image to generate Base64…" readonly=""></textarea></div><div class="actions"><button id="copyBtn" type="button">Copy Base64</button></div><div class="preview" id="encPreview">Preview</div></div><div hidden="" id="decodePanel"><div class="field"><label>Base64 / data URL</label><textarea id="raw" placeholder="Paste a data:image/...;base64,... value"></textarea></div><div class="actions"><button id="decodeBtn" type="button">Decode Image</button><a class="download" download="decoded-image.png" hidden="" id="downloadBtn">Download</a></div><div class="preview" id="decPreview">Decoded preview</div></div><div class="result" id="msg">Runs locally in your browser.</div></section></main><script>(()=>{const $=id=>document.getElementById(id),tabs=[...document.querySelectorAll('[data-mode]')];const setMode=m=>{const b=tabs.find(x=>x.dataset.mode===m)||tabs[0];tabs.forEach(x=>x.classList.toggle('active',x===b));$('encodePanel').hidden=b.dataset.mode!=='encode';$('decodePanel').hidden=b.dataset.mode!=='decode'};tabs.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode(new URLSearchParams(location.search).get('mode')||'encode');$('imgFile').onchange=()=>{const f=$('imgFile').files?.[0];if(!f)return;const r=new FileReader;r.onload=()=>{$('encoded').value=r.result;$('encPreview').innerHTML=`<img alt="Selected image preview" src="${r.result}">`;$('msg').textContent=`Encoded ${f.name} • ${(f.size/1024).toFixed(1)} KB`};r.readAsDataURL(f)};$('copyBtn').onclick=async()=>{if(!$('encoded').value)return $('msg').textContent='Select an image first.';try{await navigator.clipboard.writeText($('encoded').value);$('msg').textContent='Base64 copied.'}catch{$('encoded').select();document.execCommand('copy');$('msg').textContent='Base64 copied.'}};$('decodeBtn').onclick=()=>{let x=$('raw').value.trim();if(!x)return $('msg').textContent='Paste Base64 first.';if(!/^data:image\//i.test(x))x='data:image/png;base64,'+x.replace(/\s+/g,'');const img=new Image;img.onload=()=>{$('decPreview').innerHTML='';$('decPreview').append(img);$('downloadBtn').href=x;$('downloadBtn').hidden=false;$('msg').textContent=`Decoded ${img.naturalWidth} × ${img.naturalHeight}px`};img.onerror=()=>{$('msg').textContent='That does not look like a valid Base64 image.';$('downloadBtn').hidden=true};img.src=x}})();</script><script src="../assets/site-shell.js?v=dk12"></script></body></html>
