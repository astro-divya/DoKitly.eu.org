<!DOCTYPE html>
<html lang="en"><head>
<meta name="google-adsense-account" content="ca-pub-9623211628880604"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#f7f9fc" name="theme-color"/><title>Barcode Studio — DoKitly</title><meta content="Generate common barcode formats and decode barcode images in one tool." name="description"/><link href="../assets/favicon-32.png" rel="icon"/><link href="../tool-page.css?v=dk2fix" rel="stylesheet"/><link href="https://dokitly.in/developer-tools/barcode-studio.html" rel="canonical"/><meta content="Barcode Studio — DoKitly" property="og:title"/><meta content="Generate common barcode formats and decode barcode images in one tool." property="og:description"/><meta content="website" property="og:type"/><meta content="https://dokitly.in/developer-tools/barcode-studio.html" property="og:url"/><link href="../assets/site-shell.css?v=dk13" rel="stylesheet"/><meta content="https://dokitly.in/assets/logo.png" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Barcode Studio — DoKitly" name="twitter:title"/><meta content="Generate common barcode formats and decode barcode images in one tool." name="twitter:description"/><meta content="https://dokitly.in/assets/logo.png" name="twitter:image"/></head><body class="standalone-tool-page"><header class="it-header"><div class="it-head-inner"><a class="it-brand" href="/"><img alt="DoKitly" src="../assets/logo.png?v=2"/></a><nav class="it-nav"><a href="/">Home</a><a href="../all-tools.html">Categories</a><a href="../whats-new.html">What’s New</a></nav></div></header><main class="tool-page-shell"><div class="tool-breadcrumb"><a href="/">Home</a> / <a href="index.html">Developer</a> / Barcode Studio</div><div class="tool-page-head"><span class="tool-page-icon">▥</span><div><h1>Barcode Studio</h1><p>Generate common barcode formats and decode barcode images in one tool.</p></div></div><div class="math-card"><div class="mode-tabs suite-tabs"><button class="active" data-bmode="generate">Generate</button><button data-bmode="decode">Decode</button></div><section id="bGen"><div class="form-grid"><div class="math-field wide"><label>Barcode value</label><input id="barValue" value="123456789012"/></div><div class="math-field"><label>Format</label><select id="barFormat"><option>CODE128</option><option>CODE39</option><option>EAN13</option><option>EAN8</option><option>UPC</option><option>ITF14</option><option>MSI</option><option>codabar</option></select></div><div class="math-field"><label>Height</label><input id="barHeight" max="220" min="30" type="number" value="90"/></div><div class="math-field"><label><input checked="" id="barText" type="checkbox"/> Show value text</label></div></div><div class="math-actions"><button class="math-primary" id="barMake">Generate Barcode</button><button class="math-secondary" id="barSvg">Download SVG</button><button class="math-secondary" id="barPng">Download PNG</button></div><div class="barcode-preview"><svg id="barcode"></svg></div><div class="math-output" id="barOut">Enter a value and generate.</div></section><section hidden="" id="bDecode"><div class="math-field"><label>Barcode image</label><input accept="image/*" id="barFile" type="file"/></div><div class="math-actions"><button class="math-primary" id="barRead">Decode Image</button></div><div class="math-output" id="barDecodeOut">Upload a clear barcode image. Native BarcodeDetector is used where supported; a library fallback is attempted otherwise.</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script type="module">const $=id=>document.getElementById(id);document.querySelectorAll('[data-bmode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bmode]').forEach(x=>x.classList.toggle('active',x===b));$('bGen').hidden=b.dataset.bmode!=='generate';$('bDecode').hidden=b.dataset.bmode!=='decode'});function make(){try{if(!window.JsBarcode)throw Error('Barcode generator library could not load.');JsBarcode('#barcode',$('barValue').value,{format:$('barFormat').value,height:+$('barHeight').value||90,displayValue:$('barText').checked,margin:16,background:'#ffffff',lineColor:'#071b33'});$('barOut').innerHTML='<strong>Barcode ready</strong><small>Format and value were validated by the generator.</small>'}catch(e){$('barOut').textContent=e.message}}$('barMake').onclick=make;function svgBlob(){return new Blob([new XMLSerializer().serializeToString($('barcode'))],{type:'image/svg+xml'})}$('barSvg').onclick=()=>{make();const u=URL.createObjectURL(svgBlob()),a=document.createElement('a');a.href=u;a.download='barcode.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('barPng').onclick=()=>{make();const svg=new XMLSerializer().serializeToString($('barcode')),img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=img.width||800;c.height=img.height||240;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const x=URL.createObjectURL(b),a=document.createElement('a');a.href=x;a.download='barcode.png';a.click();setTimeout(()=>URL.revokeObjectURL(x),1000)});URL.revokeObjectURL(u)};img.src=u};$('barRead').onclick=async()=>{const f=$('barFile').files[0],out=$('barDecodeOut');if(!f)return out.textContent='Choose an image first.';out.textContent='Decoding…';const url=URL.createObjectURL(f);try{if('BarcodeDetector'in window){const det=new BarcodeDetector();const img=await createImageBitmap(f),r=await det.detect(img);if(r.length){out.innerHTML=`<strong>${r.map(x=>x.rawValue).join('<br>')}</strong><small>${r.map(x=>x.format).join(', ')}</small>`;return}}try{const {BrowserMultiFormatReader}=await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');const reader=new BrowserMultiFormatReader(),res=await reader.decodeFromImageUrl(url);out.innerHTML=`<strong>${res.getText()}</strong><small>${res.getBarcodeFormat?.()??'Barcode detected'}</small>`}catch(e){out.textContent='Could not decode this image. Try a sharper, tightly cropped barcode image.'}}finally{URL.revokeObjectURL(url)}};make();</script><script src="../assets/site-shell.js?v=dk13"></script></body></html>
