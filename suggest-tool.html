<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Suggest a Tool — DoKitly</title><meta name="description" content="Suggest a useful tool or improvement for DoKitly."><link rel="icon" href="assets/favicon-32.png"><link rel="stylesheet" href="category-tools.css?v=dk7full"><link rel="canonical" href="https://astro-divya.github.io/DoKitly.eu.org/suggest-tool.html"><link rel="stylesheet" href="assets/site-shell.css?v=dk7full"></head><body><header class="it-header"><div class="it-head-inner"><a class="it-brand" href="index.html"><img src="assets/logo.png?v=2" alt="DoKitly"></a><nav class="it-nav"><a href="index.html">Home</a><a href="all-tools.html">Categories</a><a href="whats-new.html">What’s New</a></nav></div></header><main class="it-shell"><div class="it-breadcrumb"><a href="index.html">Home</a> / Suggest a Tool</div><div class="it-title"><span class="ico">💡</span><div><h1>Suggest a Tool</h1><p>Suggest a useful tool or improvement for DoKitly.</p></div></div>
<section class="it-panel"><form id="suggestForm" class="form-grid"><div class="field"><label>Tool name</label><input id="stName" required placeholder="e.g. Resume Checker"></div><div class="field"><label>Category</label><select id="stCat"><option>PDF & Document</option><option>Image</option><option>Text</option><option>Calculators</option><option>Converters</option><option>Finance</option><option>Developer</option><option>Website & SEO</option><option>Student</option><option>Creator</option><option>Everyday</option><option>Other</option></select></div><div class="field wide"><label>What should it do?</label><textarea id="stDesc" required placeholder="Describe the workflow and why it would be useful."></textarea></div><div class="btns field wide"><button class="btn" type="submit">Open Tool Suggestion</button></div></form><p class="dk-form-note">This prepares a GitHub issue for review. Nothing is submitted automatically.</p><div class="dk-form-status" id="stStatus">Suggestions are reviewed before becoming tools.</div></section>
<script>(()=>{document.getElementById('suggestForm').addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('stName').value.trim(),c=document.getElementById('stCat').value,d=document.getElementById('stDesc').value.trim();const body=`Suggested tool: ${n}
Category: ${c}

Use case / requested workflow:
${d}`;window.open('https://github.com/astro-divya/DoKitly.eu.org/issues/new?title='+encodeURIComponent('Tool suggestion: '+n)+'&body='+encodeURIComponent(body),'_blank','noopener');const st=document.getElementById('stStatus');st.textContent='Suggestion prepared. Review and submit it in the GitHub tab.';st.className='dk-form-status ok';});})();</script></main><script src="assets/site-shell.js?v=dk7full"></script></body></html>
